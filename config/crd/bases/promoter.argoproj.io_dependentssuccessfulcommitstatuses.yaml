---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: dependentssuccessfulcommitstatuses.promoter.argoproj.io
spec:
  group: promoter.argoproj.io
  names:
    kind: DependentsSuccessfulCommitStatus
    listKind: DependentsSuccessfulCommitStatusList
    plural: dependentssuccessfulcommitstatuses
    singular: dependentssuccessfulcommitstatus
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DependentsSuccessfulCommitStatus is the Schema for the dependentssuccessfulcommitstatuses
          API
        externalDocs:
          description: CRD reference (examples and behavior)
          url: https://gitops-promoter.readthedocs.io/en/stable/crd-specs/#dependentssuccessfulcommitstatus
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of DependentsSuccessfulCommitStatus
            properties:
              key:
                description: |-
                  Key is the commit status key this controller writes on each environment's proposed hydrated SHA.
                  The PromotionStrategy controller injects this key onto every ChangeTransferPolicy's proposedCommitStatuses.
                  Must be lowercase alphanumeric with hyphens, 1–63 characters (pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$).
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              promotionStrategyRef:
                description: |-
                  PromotionStrategyRef is a reference to the promotion strategy that this dependents successful commit status
                  applies to. The controller watches this PromotionStrategy and, for each environment, reports whether the
                  environment's dependent environments (as declared on the PromotionStrategy) are promoted and successful.
                properties:
                  name:
                    description: Name is the name of the object to refer to.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
              url:
                description: |-
                  URL generates the URL to use on the per-environment CommitStatus (SCM details link), for
                  example a link into the Promoter UI that highlights this environment's dependsOn upstreams.
                  Optional; when empty, no URL is set on the child CommitStatus. The template receives
                  .Environment, .DependentsSuccessfulCommitStatus, .PromotionStrategy, .DependsOn, and .DependsOnQuery
                  (see controller docs).
                properties:
                  options:
                    description: "Options sets options for the template. Options are
                      described by\nstrings, either a simple string or \"key=value\".
                      There can be at\nmost one equals sign in an option string. If
                      the option string\nis unrecognized or otherwise invalid, Option
                      panics.\n\nKnown options:\n\nmissingkey: Control the behavior
                      during execution if a map is\nindexed with a key that is not
                      present in the map.\n\n\t\"missingkey=default\" or \"missingkey=invalid\"\n\t\tThe
                      default behavior: Do nothing and continue execution.\n\t\tIf
                      printed, the result of the index operation is the string\n\t\t\"<no
                      value>\".\n\t\"missingkey=zero\"\n\t\tThe operation returns
                      the zero value for the map type's element.\n\t\"missingkey=error\"\n\t\tExecution
                      stops immediately with an error."
                    items:
                      type: string
                    type: array
                  template:
                    description: |-
                      Template is a Go text template used to generate the CommitStatus URL. A function called
                      urlQueryEscape is available to escape URL query parameters. The template can be configured
                      with options (url.options) to control behavior when a variable is not present.

                      Available template variables depend on the parent resource that embeds URLConfig
                      (ArgoCDCommitStatus or DependentsSuccessfulCommitStatus). See the
                      corresponding gate documentation for the variable set and examples.
                    type: string
                type: object
            required:
            - key
            - promotionStrategyRef
            type: object
          status:
            description: status defines the observed state of DependentsSuccessfulCommitStatus
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of an object's state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              environments:
                description: Environments reports observed gate and upstream state
                  per dependency-graph branch.
                items:
                  description: DependentsSuccessfulCommitStatusEnvironmentStatus defines
                    observed state for one environment branch.
                  properties:
                    activeCommitStatuses:
                      description: ActiveCommitStatuses is a verbatim copy of the
                        PromotionStrategy environment's active commit statuses.
                      items:
                        description: ChangeRequestPolicyCommitStatusPhase defines
                          the phase of a commit status in a ChangeTransferPolicy.
                        properties:
                          description:
                            description: Description is the description of the commit
                              status
                            type: string
                          key:
                            description: Key staging hydrated branch
                            maxLength: 63
                            minLength: 1
                            pattern: ([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9]
                            type: string
                          phase:
                            description: Phase what phase is the status in
                            enum:
                            - pending
                            - success
                            - failure
                            type: string
                          url:
                            description: Url is the URL of the commit status
                            pattern: ^(https?://.*)?$
                            type: string
                            x-kubernetes-validations:
                            - message: must be a valid URL
                              rule: self == '' || isURL(self)
                        required:
                        - key
                        - phase
                        type: object
                      maxItems: 100
                      type: array
                      x-kubernetes-list-map-keys:
                      - key
                      x-kubernetes-list-type: map
                    branch:
                      description: Branch is the environment branch name.
                      minLength: 1
                      type: string
                    description:
                      description: Description mirrors child CommitStatus.spec.description.
                      type: string
                    phase:
                      description: Phase mirrors child CommitStatus.spec.phase.
                      enum:
                      - pending
                      - success
                      - failure
                      - ""
                      type: string
                    reportedSha:
                      description: |-
                        ReportedSha is the hydrated SHA the child CommitStatus is attached to (CommitStatus.spec.sha).
                        Semantics depend on the parent gate (proposed vs active hydrated SHA).
                        Supports both SHA-1 (40 chars) and SHA-256 (64 chars) Git hash formats.
                      maxLength: 64
                      pattern: ^([a-f0-9]{40}|[a-f0-9]{64})?$
                      type: string
                    upstreams:
                      description: Upstreams lists all transitive ancestor branches
                        and whether each is satisfied for this environment's promotion
                        target.
                      items:
                        description: |-
                          DependentsSuccessfulCommitStatusUpstreamStatus reports whether a transitive upstream branch
                          is satisfied for this environment's promotion target.
                        properties:
                          branch:
                            description: Branch is the upstream environment branch
                              name.
                            minLength: 1
                            type: string
                          reason:
                            description: Reason explains why the upstream is not satisfied.
                              Omitted when satisfied is true.
                            type: string
                          satisfied:
                            description: Satisfied is true when the upstream has promoted
                              and is healthy for this environment's target dry SHA.
                            type: boolean
                        required:
                        - branch
                        - satisfied
                        type: object
                      type: array
                      x-kubernetes-list-type: atomic
                    url:
                      description: Url mirrors child CommitStatus.spec.url.
                      pattern: ^(https?://.*)?$
                      type: string
                      x-kubernetes-validations:
                      - message: must be a valid URL
                        rule: self == '' || isURL(self)
                  required:
                  - branch
                  type: object
                maxItems: 500
                type: array
                x-kubernetes-list-map-keys:
                - branch
                x-kubernetes-list-type: map
              instanceID:
                description: |-
                  InstanceID mirrors metadata.labels[promoter.argoproj.io/instance-id] stamped on each
                  reconcile attempt by this install's controller, including when Ready=False; omitted
                  when the resource has no instance-id label (default install).
                maxLength: 63
                minLength: 1
                pattern: ^[a-zA-Z0-9]([a-zA-Z0-9._-]*[a-zA-Z0-9])?$
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the .metadata.generation that this status was reconciled from.
                  Because status is written via Server-Side Apply with ForceOwnership (which has no
                  optimistic-concurrency check), this field is the canonical way to detect stale
                  status writes: compare status.observedGeneration with metadata.generation.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
