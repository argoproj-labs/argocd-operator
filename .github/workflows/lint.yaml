name: "Validation, verifications, and lints"
on:
  pull_request:
    paths-ignore:
      - "docs/**"
    branches:
      - "master"
      - "release-*"
      - "rhos-*"

jobs:
  lint_code:
    name: Run golangci-lint and gosec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: "Ensure code passes 'go-sec' - run 'make gosec' to identify issues"
        run: |
          make gosec
      - name: "Ensure code passes 'golangci-lint' - run 'make lint' to identify issues"
        run: |
          make lint
      - name: Ensure there is no diff in code
        run: |
          git diff --ignore-matching-lines='.*createdAt:.*' --exit-code -- .

  verify_argo_cd_has_updated_dependencies:
    name: Verify Argo CD has updated dependencies, for the given target version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: "Call update dependencies Makefile target"
        env:
          ARGOCD_REDIS_HA_PROXY_IMAGE: "quay.io/akuity/haproxy@sha256:e11f034e651603f10a365e5ad5a0321825e18eded9620e40c4f4d6ae58419bfe"
          ARGOCD_REDIS_IMAGE: "quay.io/akuity/redis@sha256:4ed22bc23e35e4c2315b365ed63355f48eca31edbc5f17e8e54b7859645ef14d"
          ARGOCD_REDIS_HA_IMAGE: "quay.io/akuity/redis@sha256:4ed22bc23e35e4c2315b365ed63355f48eca31edbc5f17e8e54b7859645ef14d"
        run: |
          make update-dependencies
      - name: Ensure there is no unexpected diff in repository artifacts
        run: |
          git diff --ignore-matching-lines='.*createdAt:.*' --exit-code -- .
